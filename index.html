<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阳泉公交线路查询系统</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .system-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
        .system-tabs button { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; border-radius: 6px; font-size: 14px; }
        .system-tabs button.active { background: #007bff; color: white; border-color: #007bff; }

               #busList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
		
                       .bus-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 16px;
            background: #fafafa;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 0;
        }
        /* 让卡片在宽屏下更紧凑 */
        @media (min-width: 700px) {
            .bus-card .left {
                flex-direction: row;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
            }
            .bus-card .route {
                margin-top: 0;
            }
        }
        .bus-card:hover { background: #f0f0f0; }
        .bus-card .left {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }
        .bus-card .top-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bus-card .id { font-weight: bold; font-size: 1.2em; }
        .bus-card .system-tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            color: #fff;
            flex-shrink: 0;
        }
        .bus-card .route {
            font-size: 0.9em;
            color: #666;
            margin-top: 2px;
        }
        .bus-card .swap-btn {
            flex-shrink: 0;
            margin-left: 12px;
            padding: 4px 12px;
            border: 1px solid #ccc;
            border-radius: 16px;
            font-size: 0.75em;
            color: #555;
            background: #fff;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .bus-card .swap-btn:hover {
            background: #e6f0ff;
            border-color: #007bff;
            color: #007bff;
        }

        .search-box { width: 100%; padding: 10px; font-size: 1em; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .search-hint { font-size: 0.8em; color: #888; margin-top: 4px; }
        .note { font-size: 0.85em; color: #888; margin-top: 20px; border-top: 1px solid #eee; padding-top: 12px; }
        .empty { color: #999; text-align: center; padding: 30px 0; }
        .result-stats { font-size: 0.9em; color: #666; margin: 10px 0; }

        /* ===== 换乘规划（折叠面板） ===== */
        .transfer-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 16px 20px;
            margin: 16px 0;
            border: 1px solid #e0e0e0;
        }
        .transfer-header:hover { background: #f0f0f0; }
        .transfer-body { transition: all 0.3s ease; }
        .transfer-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .transfer-row input {
            flex: 1;
            min-width: 100px;
            padding: 8px 12px;
            font-size: 0.95em;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .transfer-row select {
            padding: 8px 12px;
            font-size: 0.95em;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            min-width: 80px;
        }
        .transfer-row button {
            padding: 8px 20px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .transfer-row button:hover { background: #0056b3; }
        .transfer-result {
            margin-top: 12px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            font-size: 0.95em;
            line-height: 1.8;
            display: none;
        }
        .transfer-result.show { display: block; }
        .transfer-result .route-line {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            color: #fff;
            margin: 0 4px;
        }
        .transfer-result .highlight-stop {
            font-weight: bold;
            color: #007bff;
        }
        .transfer-result .step {
            display: block;
            padding: 4px 0;
        }
        .transfer-result .other-route-btn {
            margin-top: 10px;
            padding: 6px 16px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .transfer-result .other-route-btn:hover { background: #218838; }
        .transfer-result .system-warning {
            color: #856404;
            background: #fff3cd;
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        /* ===== 搜索结果-站点分组 ===== */
        .search-group {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #fafafa;
            overflow: hidden;
        }
        .search-group-header {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            transition: background 0.2s;
            font-weight: 500;
            font-size: 1.05em;
        }
        .search-group-header:hover { background: #f0f0f0; }
        .search-group-header .arrow {
            margin-left: auto;
            transition: transform 0.3s;
            font-size: 0.8em;
            color: #888;
        }
        .search-group-header .arrow.open { transform: rotate(180deg); }
                .search-group-body {
            padding: 0 16px 12px 16px;
            display: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .search-group-body.open { display: flex; }
        .search-group-body .mini-card {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid #e0e0e0;
            background: #fff;
            flex: 0 1 auto;
        }
        .search-group-body .mini-card:hover {
            background: #e9ecef;
            border-color: #ddd;
        }
        .search-group-body .mini-card .mini-id {
            font-weight: 500;
            font-size: 0.9em;
        }
        .search-group-body .mini-card .mini-route {
            font-size: 0.8em;
            color: #666;
        }
        .search-group-body .mini-card .mini-tag {
            font-size: 0.6em;
            padding: 1px 8px;
            border-radius: 10px;
            color: #fff;
            flex-shrink: 0;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            max-width: 700px;
            width: 95%;
            max-height: 90vh;
            border-radius: 16px;
            padding: 24px 28px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-close:hover { color: #333; }
        .modal-title { font-size: 1.8em; font-weight: bold; margin-bottom: 4px; padding-right: 40px; }
        .modal-meta {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 12px;
            cursor: pointer;
            user-select: none;
        }
        .modal-meta:hover { color: #007bff; }
        .modal-meta span { margin-right: 16px; }

        /* ===== 纵向站点列表（新布局） ===== */
        .stops-vertical {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 0;
            max-height: 50vh;
            overflow-y: auto;
            flex-shrink: 0;
        }
                .stops-vertical .stop-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 1.05em;
            border: 1px solid #dde4f0;
            background: #f8f9fa;
            margin-bottom: 4px;
        }
        .stops-vertical .stop-row:last-child {
            margin-bottom: 0;
        }
        .stops-vertical .stop-name {
            font-weight: 500;
            min-width: 60px;
        }
        .stops-vertical .stop-dots {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .stops-vertical .stop-connector-vertical {
            color: #ccc;
            font-size: 0.8em;
            margin-left: 4px;
        }

        .modal-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 14px 18px;
            margin-top: 6px;
            font-size: 0.95em;
            line-height: 1.7;
            border-left: 4px solid #2b7be4;
            flex-shrink: 0;
        }
        .modal-info .label { font-weight: bold; color: #333; }
        .modal-tips {
            margin-top: 12px;
            border-top: 1px dashed #ddd;
            padding-top: 12px;
            font-size: 0.92em;
            color: #444;
            flex-shrink: 0;
        }
        .modal-tips .label { font-weight: bold; color: #333; }

        /* ===== 站点圆点 ===== */
        .stop-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .search-group-header .stop-dot { margin-left: 6px; }

        @media (max-width: 600px) {
            .modal { padding: 18px 16px; }
            .modal-title { font-size: 1.4em; }
            .stops-vertical .stop-row { font-size: 0.95em; padding: 3px 4px; }
            .modal-info { font-size: 0.85em; padding: 10px 14px; }
            .bus-card { padding: 10px 12px; }
            .bus-card .swap-btn { font-size: 0.65em; padding: 2px 10px; }
            .transfer-row input { min-width: 70px; font-size: 0.85em; }
            .transfer-row select { font-size: 0.85em; padding: 6px 10px; }
            .transfer-row button { font-size: 0.85em; padding: 6px 14px; }
            .stop-dot { width: 8px; height: 8px; }
            .search-group-header { font-size: 0.95em; padding: 8px 12px; }
            .search-group-body { padding: 0 12px 10px 12px; }
        }
    </style>
</head>

        const systemColorMap = {
            '城区': '#2b7be4',
            '平定': '#dc3545',
            '盂县': '#ffc107',
            '华阳': '#6f42c1'
        };

        function systemColor(sys) {
            return systemColorMap[sys] || '#999';
        }

        // ===== 获取站点所属系统列表（用于显示圆点） =====
        function getSystemsForStop(stopName) {
            if (!stopName || stopName.trim() === '') return [];
            const systems = new Set();
            busData.forEach(b => {
                if (b.stops && b.stops.includes(stopName)) {
                    systems.add(b.system);
                }
            });
            return Array.from(systems);
        }

        // ===== 生成站点圆点HTML =====
        function getStopDots(stopName) {
            if (!stopName || stopName.trim() === '') return '';
            const systems = getSystemsForStop(stopName);
            if (systems.length === 0) return '';
            return systems.map(sys => 
                `<span class="stop-dot" style="background:${systemColor(sys)};" title="${sys}"></span>`
            ).join('');
        }

        // ===== 获取方向 =====
        function getDirection(b, reversed) {
            if (reversed) {
                return { start: b.end, end: b.start, stops: [...b.stops].reverse() };
            } else {
                return { start: b.start, end: b.end, stops: b.stops };
            }
        }

        // ===== 换乘规划核心逻辑（支持系统筛选） =====
        function findAllRoutes(start, end, maxTransfers, systemFilter) {
            if (start === end) {
                return [{ type: 'same', message: '起点和终点相同，无需换乘。' }];
            }

            // 根据系统筛选数据
            let data = busData;
            if (systemFilter && systemFilter !== '全部') {
                data = busData.filter(b => b.system === systemFilter);
            }

            const results = [];

            const directLines = data.filter(b => 
                b.stops.includes(start) && b.stops.includes(end)
            );
            if (directLines.length > 0) {
                results.push({ type: 'direct', lines: directLines, start: start, end: end });
            }

            const queue = [];
            const visited = new Set();
            
            const startLines = data.filter(b => b.stops.includes(start));
            for (const line of startLines) {
                const key = line.id + '|' + line.system;
                if (!visited.has(key)) {
                    visited.add(key);
                    queue.push({
                        line: line,
                        transferStops: [],
                        path: [line]
                    });
                }
            }

            while (queue.length > 0 && results.length < 5) {
                const current = queue.shift();
                const currentLine = current.line;
                const currentPath = current.path;

                if (currentLine.stops.includes(end)) {
                    results.push({
                        type: 'multiTransfer',
                        path: currentPath,
                        transferStops: current.transferStops,
                        start: start,
                        end: end
                    });
                    continue;
                }

                if (currentPath.length > maxTransfers) continue;

                for (const stop of currentLine.stops) {
                    const nextLines = data.filter(b => 
                        b.stops.includes(stop) && 
                        !(b.id === currentLine.id && b.system === currentLine.system)
                    );
                    for (const nextLine of nextLines) {
                        const key = nextLine.id + '|' + nextLine.system;
                        if (!visited.has(key)) {
                            if (currentPath.some(p => p.id === nextLine.id && p.system === nextLine.system)) {
                                continue;
                            }
                            visited.add(key);
                            const newTransferStops = [...current.transferStops, stop];
                            queue.push({
                                line: nextLine,
                                transferStops: newTransferStops,
                                path: [...currentPath, nextLine]
                            });
                        }
                    }
                }
            }

            return results;
        }

            busData.forEach(b => {

                    }
                });
            });
            return stopSet.size;
        }

            const stopGroups = [];
            matchedStops.forEach(stop => {
                const lines = busData.filter(b => b.stops.includes(stop));
                const filteredLines = currentSystem === '全部' 
                    ? lines 
                    : lines.filter(b => b.system === currentSystem);
                if (filteredLines.length > 0) {
                    stopGroups.push({
                        stop: stop,
                        lines: filteredLines,
                        systems: getSystemsForStop(stop)
                    });
                }
            });

            stopGroups.sort((a, b) => a.stop.localeCompare(b.stop));

            document.getElementById('totalCount').textContent = busData.length;
            document.getElementById('lineCount').textContent = stopGroups.reduce((sum, g) => sum + g.lines.length, 0);
            document.getElementById('totalStops').textContent = calcTotalStops();

            if (stopGroups.length === 0) {
                list.innerHTML = '<div class="empty">没有匹配的站点</div>';
                return;
            }

            let html = '';
            stopGroups.forEach((group, idx) => {
                const dots = group.systems.map(sys => 
                    `<span class="stop-dot" style="background:${systemColor(sys)};" title="${sys}"></span>`
                ).join('');
                const groupId = 'group-' + idx;
                html += `
                    <div class="search-group">
                        <div class="search-group-header" data-group="${groupId}">
                            <span>📍 ${group.stop}</span>
                            ${dots}
                            <span class="arrow" id="arrow-${groupId}">▼</span>
                        </div>
                        <div class="search-group-body" id="body-${groupId}">
                            ${group.lines.map(b => `
                                <div class="mini-card" data-id="${b.id}">
                                    <span class="mini-id">${b.id}</span>
                                    <span class="mini-route">${b.start} → ${b.end}</span>
                                    <span class="mini-tag" style="background:${systemColor(b.system)};">${b.system}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;

            document.querySelectorAll('.search-group-header').forEach(header => {
                header.addEventListener('click', function() {
                    const groupId = this.dataset.group;
                    const body = document.getElementById('body-' + groupId);
                    const arrow = document.getElementById('arrow-' + groupId);
                    body.classList.toggle('open');
                    arrow.classList.toggle('open');
                });
            });

            document.querySelectorAll('.mini-card').forEach(el => {
                el.addEventListener('click', function() {
                    const id = this.dataset.id;
                    openModal(id, false);
                });
            });
        }

        // ===== 模态框 =====
        let currentModalId = null;
        let currentModalReversed = false;

        function openModal(id, reversed) {
            const b = busData.find(item => item.id === id);
            if (!b) return;
            currentModalId = id;
            currentModalReversed = reversed || false;
            updateModal();
            document.getElementById('modalOverlay').classList.add('active');
        }

                function updateModal() {
            const b = busData.find(item => item.id === currentModalId);
            if (!b) return;
            const dir = getDirection(b, currentModalReversed);

            document.getElementById('modalTitle').textContent = b.id;
            document.getElementById('modalSystem').textContent = b.system;
            document.getElementById('modalStartEnd').innerHTML =
                `${dir.start} → ${dir.end} <span style="font-size:0.8em;color:#999;">（点击换向）</span>`;

            const container = document.getElementById('modalStops');
            // 纵向站点列表 + 竖线连接符
            let html = '<div style="display:flex;flex-direction:column;align-items:center;padding:8px 0;">';
            dir.stops.forEach((s, index) => {
                const dots = getStopDots(s);
                html += `
                    <div style="display:flex;align-items:center;gap:10px;padding:4px 0;">
                        <span style="font-size:1.05em;font-weight:500;">${s}</span>
                        <span style="display:flex;gap:4px;align-items:center;">${dots}</span>
                    </div>
                `;
                if (index < dir.stops.length - 1) {
                    html += `
                        <div style="display:flex;align-items:center;padding-left:4px;height:16px;color:#ccc;font-size:0.9em;">
                            ↓
                        </div>
                    `;
                }
            });
            html += '</div>';
            container.innerHTML = html;

            document.getElementById('modalFare').textContent = b.fare || '待补充';
            document.getElementById('modalCard').textContent = b.card || '待补充';
            document.getElementById('modalNote').textContent = b.note || '暂无';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // ===== 换乘规划UI（带系统筛选） =====
        let allRouteResults = [];
        let currentResultIndex = 0;

        function formatRouteResult(result) {
            if (result.type === 'same') {
                return `✅ ${result.message}`;
            } else if (result.type === 'direct') {
                const sampleLine = result.lines[0];
                const start = result.start;
                const end = result.end;
                const startIdx = sampleLine.stops.indexOf(start);
                const endIdx = sampleLine.stops.indexOf(end);
                const stopsCount = Math.abs(endIdx - startIdx);
                const direction = (startIdx < endIdx) ? `开往 ${sampleLine.end} 方向` : `开往 ${sampleLine.start} 方向`;
                const lines = result.lines.map(b => 
                    `<span class="route-line" style="background:${systemColor(b.system)};">${b.id}</span>`
                ).join('、');
                return `✅ 直达线路：${lines}<br>乘坐 <strong>${sampleLine.id}</strong>（${direction}），从 <strong>${start}</strong> 出发，经过 <strong>${stopsCount}</strong> 站到达 <strong>${end}</strong>。`;
            } else if (result.type === 'multiTransfer') {
                const path = result.path;
                const transferStops = result.transferStops;
                const start = result.start;
                const end = result.end;
                let stepsHtml = '';
                let currentStation = start;
                let totalStops = 0;

                for (let i = 0; i < path.length; i++) {
                    const line = path[i];
                    const color = systemColor(line.system);
                    const isLast = (i === path.length - 1);
                    const nextStation = isLast ? end : transferStops[i];
                    const startIdx = line.stops.indexOf(currentStation);
                    const endIdx = line.stops.indexOf(nextStation);
                    const stopsCount = Math.abs(endIdx - startIdx);
                    totalStops += stopsCount;

                    const direction = (startIdx < endIdx) ? `开往 ${line.end} 方向` : `开往 ${line.start} 方向`;

                    if (i === 0) {
                        stepsHtml += `<span class="step">① 乘坐 <span class="route-line" style="background:${color};">${line.id}</span>（${direction}），从 <strong>${currentStation}</strong> 出发，经过 <strong>${stopsCount}</strong> 站到达 <strong class="highlight-stop">${nextStation}</strong> 下车；</span>`;
                    } else if (isLast) {
                        stepsHtml += `<span class="step">${i+1}️⃣ 换乘 <span class="route-line" style="background:${color};">${line.id}</span>（${direction}），从 <strong class="highlight-stop">${currentStation}</strong> 上车，经过 <strong>${stopsCount}</strong> 站到达 <strong>${end}</strong>。</span>`;
                    } else {
                        stepsHtml += `<span class="step">${i+1}️⃣ 换乘 <span class="route-line" style="background:${color};">${line.id}</span>（${direction}），从 <strong class="highlight-stop">${currentStation}</strong> 上车，经过 <strong>${stopsCount}</strong> 站到达 <strong class="highlight-stop">${nextStation}</strong> 下车；</span>`;
                    }
                    currentStation = nextStation;
                }

                const transferCount = path.length - 1;
                return `✅ ${transferCount}次换乘方案（共 ${totalStops} 站）：<br>${stepsHtml}`;
            }
            return '';
        }

        function showTransferResult() {
            const start = document.getElementById('transferStart').value.trim();
            const end = document.getElementById('transferEnd').value.trim();
            const systemFilter = document.getElementById('systemFilter').value;
            const resultDiv = document.getElementById('transferResult');

            if (!start || !end) {
                resultDiv.innerHTML = '⚠️ 请输入起点和终点站名。';
                resultDiv.className = 'transfer-result show';
                return;
            }

            // 如果选择"全部"，显示警告
            let warningHtml = '';
            if (systemFilter === '全部') {
                warningHtml = `<div class="system-warning">⚠️ 已选择「全部」系统，不同系统的同名站点可能不在同一位置，请确认换乘站的实际归属。</div>`;
            }

            allRouteResults = findAllRoutes(start, end, 3, systemFilter);
            currentResultIndex = 0;

            if (allRouteResults.length === 0) {
                resultDiv.innerHTML = warningHtml + '❌ 未找到换乘方案。请尝试其他站点或确认站名是否正确。';
                resultDiv.className = 'transfer-result show';
                return;
            }

            let html = warningHtml + formatRouteResult(allRouteResults[0]);
            if (allRouteResults.length > 1) {
                html += `<br><button class="other-route-btn" id="nextRouteBtn">🔄 规划其他路线（${allRouteResults.length - 1}条可选）</button>`;
            }
            resultDiv.innerHTML = html;
            resultDiv.className = 'transfer-result show';

            document.getElementById('nextRouteBtn')?.addEventListener('click', function() {
                currentResultIndex = (currentResultIndex + 1) % allRouteResults.length;
                const result = allRouteResults[currentResultIndex];
                let newHtml = warningHtml + formatRouteResult(result);
                if (allRouteResults.length > 1) {
                    newHtml += `<br><button class="other-route-btn" id="nextRouteBtn">🔄 规划其他路线（${allRouteResults.length - 1}条可选）</button>`;
                }
                resultDiv.innerHTML = newHtml;
                document.getElementById('nextRouteBtn')?.addEventListener('click', arguments.callee);
            });
        }

        // ===== 折叠面板切换 =====
        document.getElementById('transferToggle').addEventListener('click', function() {
            const body = document.getElementById('transferBody');
            const arrow = document.getElementById('transferArrow');
            if (body.style.display === 'none') {
                body.style.display = 'block';
                arrow.textContent = '▼';
                document.getElementById('transferResult').className = 'transfer-result';
                document.getElementById('transferResult').innerHTML = '';
            } else {
                body.style.display = 'none';
                arrow.textContent = '▶';
            }
        });

        // ===== 事件绑定 =====
        document.getElementById('modalMeta').addEventListener('click', function() {
            if (currentModalId === null) return;
            currentModalReversed = !currentModalReversed;
            updateModal();
        });

        document.getElementById('modalClose').addEventListener('click', function(e) {
            e.stopPropagation();
            closeModal();
        });

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('searchInput').addEventListener('input', function() {
            const raw = this.value.trim();
            currentSearch = raw;
            searchKeywords = raw.split(/[,，]/).map(s => s.trim()).filter(s => s !== '');
            render();
        });

        document.getElementById('transferBtn').addEventListener('click', showTransferResult);

        document.getElementById('transferEnd').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') showTransferResult();
        });
        document.getElementById('transferStart').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') showTransferResult();
        });

        document.querySelectorAll('.system-tabs button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.system-tabs button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentSystem = this.dataset.system;
                render();
            });
        });

        // ===== 启动渲染 =====
        render();
    </script>
</body>
</html>
